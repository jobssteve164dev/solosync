name: Publish VS Code Extension

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Determine release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          initial_plan="$(node scripts/release-plan.mjs)"
          tag="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).tag)' "$initial_plan")"
          released_tag=""
          released_assets=""
          release_exists="false"
          source_ref="$GITHUB_SHA"
          release_json="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" | node -e '
            let input = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const releases = JSON.parse(input).flat();
              const matches = releases.filter(({ tag_name: tagName }) => tagName === process.argv[1]);
              if (matches.length > 1) throw new Error(`Multiple releases found for ${process.argv[1]}`);
              if (matches[0]) process.stdout.write(JSON.stringify(matches[0]));
            });
          ' "$tag")"
          if [ -n "$release_json" ]; then
            release_exists="true"
            released_assets="$(node -e '
              const release = JSON.parse(process.argv[1]);
              process.stdout.write(release.assets.map(({ name }) => name).join("\n"));
            ' "$release_json")"
            if [ "$(node -e 'process.stdout.write(String(JSON.parse(process.argv[1]).draft))' "$release_json")" = "true" ]; then
              source_ref="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).target_commitish)' "$release_json")"
              if ! [[ "$source_ref" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::Draft release target must be an immutable commit SHA"
                exit 1
              fi
            else
              source_ref="$tag"
              released_tag="$tag"
            fi
          else
            if git rev-parse --verify --quiet "refs/tags/$tag^{commit}" >/dev/null; then
              source_ref="$tag"
            fi
          fi
          plan="$(node scripts/release-plan.mjs --released-tags "$released_tag" --released-assets "$released_assets")"
          node -e '
            const plan = JSON.parse(process.argv[1]);
            process.stdout.write(`version=${plan.version}\ntag=${plan.tag}\nshould_publish=${plan.shouldPublish}\n`);
          ' "$plan" >> "$GITHUB_OUTPUT"
          echo "release_exists=$release_exists" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
      - name: Check out frozen release source
        if: steps.release.outputs.should_publish == 'true'
        run: |
          git checkout --detach "${{ steps.release.outputs.source_ref }}"
          test "$(node -p "require('./package.json').version")" = "${{ steps.release.outputs.version }}"
      - name: Install dependencies
        if: steps.release.outputs.should_publish == 'true'
        run: npm ci
      - name: Validate publishing secrets
        if: steps.release.outputs.should_publish == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          test -n "$VSCE_PAT" || { echo "::error::VSCE_PAT is empty"; exit 1; }
          test -n "$OVSX_PAT" || { echo "::error::OVSX_PAT is empty"; exit 1; }
          npx --no-install ovsx -p "$OVSX_PAT" verify-pat SZLK
      - name: Audit dependencies
        if: steps.release.outputs.should_publish == 'true'
        run: npm audit --audit-level=high
      - name: Test extension
        if: steps.release.outputs.should_publish == 'true'
        run: npm test
      - name: Package extension
        if: steps.release.outputs.should_publish == 'true'
        run: npx @vscode/vsce package --out "solosync-${{ steps.release.outputs.version }}.vsix"
      - name: Prepare draft release
        if: steps.release.outputs.should_publish == 'true' && steps.release.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" \
            --draft \
            --target "${{ steps.release.outputs.source_ref }}" \
            --title "${{ steps.release.outputs.tag }}" \
            --notes-file CHANGELOG.md
      - name: Publish to Visual Studio Marketplace
        if: steps.release.outputs.should_publish == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish --packagePath "solosync-${{ steps.release.outputs.version }}.vsix" --skip-duplicate
      - name: Publish to Open VSX
        if: steps.release.outputs.should_publish == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --no-install ovsx -p "$OVSX_PAT" publish "solosync-${{ steps.release.outputs.version }}.vsix" --skip-duplicate
      - name: Publish GitHub release
        if: steps.release.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.release.outputs.tag }}"
          asset="solosync-${{ steps.release.outputs.version }}.vsix"
          gh release upload "$tag" "$asset" --clobber
          gh release edit "$tag" --draft=false
      - name: Verify Open VSX availability
        if: steps.release.outputs.should_publish == 'true'
        run: |
          for i in {1..30}; do
            if curl -fsS "https://open-vsx.org/api/SZLK/solosync/${{ steps.release.outputs.version }}" >/tmp/openvsx.json; then
              node -e "const d=require('/tmp/openvsx.json'); if(d.namespace!=='SZLK'||d.name!=='solosync'||d.version!=='${{ steps.release.outputs.version }}') process.exit(1)"
              exit 0
            fi
            sleep 20
          done
          echo "::warning::Open VSX visibility is still pending"
